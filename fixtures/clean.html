<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean fixture: no defects</title>
<style>
  body { margin: 0; font: 16px/1.4 monospace; color: #111; background: #fff; }
  section { padding: 24px; }
  .card { width: 30ch; border: 1px solid #999; padding: 8px; }
  #hero { height: 80px; background-image: linear-gradient(90deg, #111, #333); }
  #hero p { color: #fff; font-size: 24px; margin: 0; }
  img { display: block; width: 120px; height: 60px; }
</style>
</head>
<body>
<section data-section="intro">
  <h1>Welcome</h1>
  <p>Short paragraph with enough words to wrap onto a second line, ending cleanly.</p>
</section>
<section data-section="card">
  <div class="card">A card whose height follows its text, nothing is cut.</div>
</section>
<section data-section="picture">
  <img alt="banner" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='60'><rect width='120' height='60' fill='%2336a'/></svg>">
</section>
<section id="hero" data-section="hero">
  <p>White headline on a dark gradient</p>
</section>
</body>
</html>
